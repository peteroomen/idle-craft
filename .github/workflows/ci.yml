name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - name: Sprites are up to date
        run: npm run sprites && git diff --exit-code -- public/icons public/app src/app/icon.png src/app/apple-icon.png src/content/sprite-manifest.json
      - name: Balance report is up to date
        run: npm run balance && git diff --exit-code -- balance/report.md
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
